appId: com.stockbill.app
productName: StockBill
copyright: StockBill

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: true

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.business
  identity: null
