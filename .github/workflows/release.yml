name: Release

# Runs on every push to main that changes more than documentation.
# verify -> version (tag from Conventional Commits) -> build installers on 3 OSes -> publish GitHub Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify

  version:
    name: Compute version and tag
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version from Conventional Commits and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          release_branches: main

  build:
    name: Build installer (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.new_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version into package.json (not committed)
        shell: bash
        run: npm version "${{ needs.version.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: StockBill ${{ needs.version.outputs.new_tag }}
          generate_release_notes: true
          files: release-files/*
